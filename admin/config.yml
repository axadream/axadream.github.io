backend:
  name: github
  repo: axadream/axadream.github.io
  branch: main
media_folder: assets/img/log
public_folder: /assets/img/log
site_url: https://alepax.com
display_url: https://alepax.com
slug:
  timezone: utc
collections:
  - name: log
    label: Log
    folder: content/log
    create: true
    extension: md
    format: frontmatter
    identifier_field: body
    slug: "{{year}}{{month}}{{day}}T{{hour}}{{minute}}{{second}}Z-{{fields.body | truncate(40, '')}}"
    summary: "{{ts}} {{made}} {{track}}: {{body}}"
    sortable_fields:
      fields: [ts, made, track]
      default:
        field: ts
        direction: Descending
    fields:
      - {label: Timestamp, name: ts, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', date_format: 'YYYY-MM-DD', time_format: 'HH:mm', picker_utc: false, required: true}
      - {label: Made, name: made, widget: select, options: ["AI-guided", "Manual", "Mixed"], required: true}
      - {label: Track, name: track, widget: select, options: ["App", "AI Study", "Math", "3D"], required: true}
      - label: Cards
        name: cards
        widget: list
        label_singular: Card
        required: false
        field: {label: Card, name: card, widget: string, pattern: ['^L[0-9]-[0-9]{3}$', 'Format L<n>-<nnn>, e.g. L1-001'], required: false}
      - {label: Proof, name: proof, widget: string, pattern: ['^https://(github\.com/axadream/|alepax\.com/).+', 'GitHub (axadream) or alepax.com link'], hint: 'GitHub (axadream) or alepax.com link. Required when Made is AI-guided or Mixed; the build guard fails without it.', required: false}
      - {label: Prompt trace, name: trace, widget: markdown, maxlength: 1500, required: false}
      - {label: Minutes, name: minutes, widget: number, value_type: int, min: 1, max: 600, required: false}
      - {label: Draft, name: draft, widget: boolean, default: false, required: false}
      - {label: Text, name: body, widget: text, maxlength: 300, required: true}
